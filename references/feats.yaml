---
- name: Backstab
  backgrounds:
  - Scoundrel
  requirements: None
  description: >-
    Take advantage a foe's split attention to deliver an exceptionally deadly
    strike against the kinks in their defenses.
  effect: >-
    Gain the "backstab" minor action. When taking this action, if an enemy is 5ft from one of your allies, and more than 5ft from any of its allies, you may reroll one of your attack dice when making a weapon attack major action.

- name: Cleave
  backgrounds:
  - Mercenary
  requirements: Magi
  description: >-
    Combat experience instructs you to aim your blows such that powerful swings
    cleave through multiple enemies.
  effect: >-
    If your melee weapon attack action brings an opponent to 0 HP, you may
    perform a second attack against another enemy within 5ft of you.

- name: Combat Action - Disarm
  backgrounds:
  - Scoundrel
  requirements: None
  description: >-
    Training in weapon holds and combat styles allows you to break grips on
    your opponents weapon.
  effect: >-
    When making a weapon attack, declare it as a disarm attack. Instead of
    dealing ability damage in the attack, instead perform a reflex ability
    challenge against yourself. On a loss, the opponent drops their weapon to
    the ground. Intelligent enemies gain one level of advantage in the ability
    challenge each time this ability is used again in the encounter.

- name: Combat Action - Shove
  backgrounds:
  - Mercenary
  requirements: None
  description: >-
    A mad dash ends in a running tackle aiming to bring an opponent to their
    knees.
  effect: >-
    When taking the movement minor action, if the movement ends in a 15ft
    straight line dash in front of an opponent, then the opponent makes a Power
    ability challenge against yourself. On a loss, the opponent is put into the
    fallen state. Intelligent enemies gain one level of advantage in the
    ability challenge each time this ability is used again in the encounter.

- name: Delayed Action
  backgrounds:
  - Exemplar
  requirements: None
  description: >-
    Experience in patience while in the thick of battle has taught
    you to automatically act when it is most beneficial.
  effect: >-
    Prepare your minor action and a major action until later in the turn order
    without having to use the hold minor action.

- name: Deep Cuts
  backgrounds:
  - Scoundrel
  requirements: Grandmagi
  description: >-
    Assassination arts culminate in attacks that strike at the very heart of
    the vital points of foes.
  effect: >-
    Critical weapon strikes triple damage instead of doubling it.

- name: Dual Guard
  backgrounds:
  - Exemplar
  requirements: None
  description: >-
    Through shared rhythm learned by journeying together, you are able defend
    your allies as well as yourself when weaving in and out of combat.
  effect: >-
    When you take the block action, one ally within 5 feet also
    gains the effect

- name: Engagement
  backgrounds:
  - Mercenary
  requirements: None
  description: >-
    A concentration of feints and threatening stances demand attention from an
    opponent.
  effect: >-
    Whenever there is only a single armed enemy within 5ft of you, that enemy
    is unable to move further away from you without incurring a weapon attack
    action from you. This effect can only occur once until the beginning of
    your next turn.

- name: Instinctive battle plans
  backgrounds:
  - Exemplar
  requirements: Major battle plans feature, Magi level
  description: >-
    Experience with all kinds of foes and hard earned teamwork allows you to
    guide your party on autopilot, all while continuing a battle yourself.
  effect: >-
    The "major battle plans" action can be used as a free action.

- name: Melee Mastery
  backgrounds:
  - Mercenary
  requirements: Grandmagi
  description: >-
    The height of melee combat experience is expressed in fluid expression and
    unrelenting speed.
  effect: >-
    When making melee weapon attacks, make two separate back to back
    attacks. These attacks can be against the same target or different targets.

- name: Minor battle plans
  backgrounds:
  - Exemplar
  requirements: None
  description: >-
    Preparations and battle signals allow an ally to continue their actions
    with efficiency.
  effect: >-
    Gain the "Minor battle plans" minor action. This action lets you select
    another player to take a minor action during your turn instead of you.
    You decide who, and they decide which action to take. They cannot take
    the same minor action twice in a row.

- name: Major battle plans
  backgrounds:
  - Exemplar
  requirements: Minor battle plans feature
  description: >-
    Continued experience and teamwork allows your allies to more efficiently
    act while in the heat of battle.
  effect: >-
    Gain the "Major battle plans" major action. This action lets you select
    another player to take a major action during your turn instead of you.
    You decide who, and they decide which action to take.

- name: Power Strike
  backgrounds:
  - Mercenary
  requirements: Journeyman
  description: >-
    Physical training and the weight of a solid weapon is all put into a single
    deadly blow.
  effect: >-
    Gain the "power strike" minor action. When using this minor action in a
    turn, weapon attack crits also double the direct damage of the attack.

- name: Second Wind
  backgrounds:
  - Mercenary
  requirements: Journeyman
  description: >-
    A hardened resolve and downright grit allow you to face down a mortal blow.
  effect: >-
    Once per respite, when you HP is reduced to 0, it remains at 1 instead

- name: Swift Execution
  backgrounds:
  - Scoundrel
  requirements: None
  description: >-
    A knowledge about weak points with an eye for openings allow you to
    capitalize on weak opponents while keeping combat momentum.
  effect: >-
    When your weapon attack action brings an opponent to 0 HP, you may take a
    second minor action this turn. It can not be the same minor action as your
    normal action this turn.

- name: Quick Draw
  backgrounds:
  - Scoundrel
  requirements: None
  description: >-
    Customized attachments points and quick releases built into your armor allow for an array of weapons to be easily accessible.
  effect: >-
    The switch weapons minor action can be taken as a free action.
